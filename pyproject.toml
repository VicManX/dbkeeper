[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbkeeper"
version = "0.1.0"
description = "Backups locales verificables de PostgreSQL remoto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dbkeeper = "dbkeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

